<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="3200" viewBox="0 0 2000 3200">
<defs>
    <linearGradient id="shellGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBFCFF"/>
      <stop offset="0.68" stop-color="#FBFCFF"/>
      <stop offset="1" stop-color="#E7EBF4"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#122552"/>
      <stop offset="1" stop-color="#04102E"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#28CFEF"/>
      <stop offset="0.48" stop-color="#2676D8"/>
      <stop offset="1" stop-color="#205AAF"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .outline{stroke:#050F2B;stroke-width:18;stroke-linecap:round;stroke-linejoin:round}
      .thin{stroke:#050F2B;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
      .cyan-stroke{stroke:#28CFEF;stroke-width:44;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .guide{display:none;fill:#FF5A6A;stroke:none}
    </style>
  </defs>
  <!-- 11_Left_Ear -->
  <g transform="translate(200 0)"><g id="ear_left">
    <rect x="72" y="560" width="156" height="410" rx="78" fill="url(#shellGrad)" class="outline"/>
    <rect x="102" y="610" width="38" height="310" rx="19" fill="#2676D8"/>
    <ellipse cx="160" cy="765" rx="28" ry="108" fill="#28CFEF" opacity=".9"/>
  </g></g>
  <!-- 12_Right_Ear -->
  <g transform="translate(200 0)"><g id="ear_right">
    <rect x="1372" y="560" width="156" height="410" rx="78" fill="url(#shellGrad)" class="outline"/>
    <rect x="1460" y="610" width="38" height="310" rx="19" fill="#2676D8"/>
    <ellipse cx="1440" cy="765" rx="28" ry="108" fill="#28CFEF" opacity=".9"/>
  </g></g>
  <!-- 13_Head -->
  <g transform="translate(200 0)"><path d="M 525 200 H 1075 Q 1530 200 1530 655 V 865 Q 1530 1320 1075 1320 H 525 Q 70 1320 70 865 V 655 Q 70 200 525 200 Z M 515 400 H 1085 Q 1370 400 1370 685 V 835 Q 1370 1120 1085 1120 H 515 Q 230 1120 230 835 V 685 Q 230 400 515 400 Z" fill="url(#shellGrad)" fill-rule="evenodd" class="outline"/>
  <path d="M 325 390 Q 770 230 1240 365" stroke="#FFFFFF" stroke-width="42" stroke-linecap="round" fill="none" opacity=".72"/>
  <path d="M 205 1100 Q 800 1345 1395 1095" stroke="#BCC6DA" stroke-width="34" stroke-linecap="round" fill="none" opacity=".42"/></g>
  <!-- 14_Face_Screen -->
  <g transform="translate(200 0)"><path d="M 515 400 H 1085 Q 1370 400 1370 685 V 835 Q 1370 1120 1085 1120 H 515 Q 230 1120 230 835 V 685 Q 230 400 515 400 Z" fill="url(#navyGrad)" class="outline"/>
  <path d="M 420 505 Q 800 420 1180 505" stroke="#1C3868" stroke-width="20" fill="none" opacity=".44"/></g>
</svg>
