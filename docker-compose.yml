services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Beirut
      - TZ=Asia/Beirut
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - EXECUTIONS_TIMEOUT=300
      - EXECUTIONS_TIMEOUT_MAX=600
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - NODES_EXCLUDE=
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RESTRICT_FILE_ACCESS_TO=/shared_docs
      - N8N_CORS_ALLOW_ORIGIN=*
    volumes:
      - ./n8n_local_data:/home/node/.n8n
      - ./shared_docs:/shared_docs
    depends_on:
      - qdrant
      - whisper

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_data:/qdrant/storage

  whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    container_name: whisper
    restart: always
    ports:
      - "8000:8000"
    environment:
      - WHISPER__MODEL=base
      - WHISPER__INFERENCE_DEVICE=cpu
    volumes:
      - ./whisper_data:/root/.cache/huggingface

  web:
    build: ./web
    container_name: web
    restart: unless-stopped
    ports:
      - "5173:5173"
      - "3001:3001"
    environment:
      - VITE_N8N_WEBHOOK_URL=/webhook/rag-agent
      - VITE_APP_TITLE=IUL Agent
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - n8n