services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: always
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Beirut
      - TZ=Asia/Beirut
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - EXECUTIONS_TIMEOUT=300
      - EXECUTIONS_TIMEOUT_MAX=600
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - NODES_EXCLUDE=
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RESTRICT_FILE_ACCESS_TO=/shared_docs
      - N8N_CORS_ALLOW_ORIGIN=*
    volumes:
      - ./n8n_local_data:/home/node/.n8n
      - ./shared_docs:/shared_docs
    depends_on:
      - qdrant
      - whisper
      - redis
      - postgres

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - ./redis_data:/data
    # Cached TTS audio averages ~0.55MB per entry, so 3gb holds roughly 5,500 spoken
    # answers. Sized to hold one full TTL period (30 days) even at admission-season
    # traffic (~180 new entries/day), so entries age out on the TTL rather than being
    # evicted early. Entries are keyed by exact normalized question text with no
    # semantic matching, so paraphrases of the same question each take their own slot.
    # Kept under the ~6GB free in the Docker VM: Redis needs headroom above maxmemory
    # for allocator fragmentation and the AOF rewrite fork.
    # allkeys-lru means a full cache drops the least-used entry instead of erroring.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "3gb", "--maxmemory-policy", "allkeys-lru", "--requirepass", "${REDIS_PASSWORD}"]

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./postgres_init:/docker-entrypoint-initdb.d

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_data:/qdrant/storage

  whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    container_name: whisper
    restart: always
    ports:
      - "8000:8000"
    environment:
      - WHISPER__MODEL=base
      - WHISPER__INFERENCE_DEVICE=cpu
    volumes:
      - ./whisper_data:/root/.cache/huggingface

  web:
    build: ./web
    container_name: web
    restart: unless-stopped
    ports:
      - "5173:5173"
      - "3001:3001"
    environment:
      - VITE_N8N_WEBHOOK_URL=/webhook/rag-agent
      - CHOKIDAR_USEPOLLING=true
      # Where the Bun sidecar reads/writes the tenant branding document.
      - BRANDING_FILE=/app/branding/branding.json
      # Required to save branding from the admin UI. Leave unset only for
      # local development — an unset value means anyone who can reach the
      # container can rebrand the kiosk.
      # Operator passcode gates branding writes on the Bun sidecar. Must be the
      # same secret whose sha256 is stored as admin_settings.operator_passcode_sha256,
      # because the operator console forwards the passcode it authenticated with.
      - OPERATOR_PASSCODE=${ADMIN_DASHBOARD_PASSCODE:-}
    volumes:
      - ./web:/app
      - /app/node_modules
      # Tenant branding lives outside the source tree so a client's logos and
      # colours survive image rebuilds and never get committed.
      - ./branding:/app/branding
    depends_on:
      - n8n